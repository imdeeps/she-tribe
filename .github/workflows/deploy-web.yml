name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Add web platform files
        run: flutter create --org com.shetribe --project-name she_tribe --platforms=web .

      - name: Make sure the app code was not overwritten
        run: git diff --exit-code -- lib test pubspec.yaml

      - run: flutter pub get

      - name: App icons
        run: dart run flutter_launcher_icons -f flutter_launcher_icons-web.yaml
        continue-on-error: true

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Test
        run: flutter test

      - name: Build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
        ARGS=(--release --base-href "/")
          [ -n "$SUPABASE_URL" ] && ARGS+=(--dart-define=SUPABASE_URL="$SUPABASE_URL")
          [ -n "$SUPABASE_ANON_KEY" ] && ARGS+=(--dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY")
          [ -n "$SITE_URL" ] && ARGS+=(--dart-define=SITE_URL="$SITE_URL")
          flutter build web "${ARGS[@]}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
